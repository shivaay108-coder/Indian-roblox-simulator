
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Indian Roblox Simulator</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white;touch-action:none}
#world{position:fixed;inset:0}
canvas{display:block}
button{border:0;border-radius:12px;background:#172b40;color:white;font-weight:bold;padding:12px;cursor:pointer}
button:active{transform:scale(.95)}
.panel{background:rgba(13,25,40,.91);border:1px solid #45dfff;border-radius:12px;padding:10px}
#hud{position:fixed;inset:0;pointer-events:none}
#money{position:absolute;top:10px;left:10px;color:#80ffae;font-weight:bold}
#mini{position:absolute;right:10px;top:10px;width:145px;height:145px;background:#233b2d;border:2px solid #42eaff;border-radius:12px}
#phoneBtn{position:absolute;right:15px;bottom:20px;font-size:27px;pointer-events:auto}
#phone{display:none;position:absolute;right:10px;bottom:80px;width:min(330px,94vw);height:470px;overflow:auto;pointer-events:auto;background:#111d2b;border:3px solid #36dcff;border-radius:25px;padding:12px}
#phone h2{text-align:center}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.app{background:#23354b;border-radius:15px;padding:14px 4px;text-align:center;min-height:80px;cursor:pointer}
.app span{font-size:27px;display:block;margin-bottom:5px}
#appPage{margin-top:12px}
#appPage button{width:100%;margin:4px 0}
input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;background:#1d3044;color:white;border:1px solid #45dfff}
#phoneClose{width:100%;margin-top:10px;background:#a83232}
#message{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);background:#102133d9;border-radius:12px;padding:10px;text-align:center;max-width:90%;white-space:normal}
#joy{position:absolute;left:15px;bottom:20px;display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px;gap:5px;pointer-events:auto}
#joy button{padding:0;background:#183e60d9;border:1px solid #4be8ff;font-size:21px;touch-action:none}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{position:absolute;right:10px;bottom:15px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#actions button{width:60px;height:60px;background:#16486bdc;border:1px solid #47e7ff;font-size:20px;padding:4px}
#carInfo{display:none;position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#101e2c;border:1px solid cyan;padding:10px;border-radius:12px;text-align:center}
#carInfo button{padding:8px}
#job{position:absolute;left:10px;top:55px;max-width:200px;font-size:12px}
#hideUI{display:none}
</style>
</head>

<body>
<div id="world"></div>

<div id="hud">
  <div id="money">₹ 500</div>
  <canvas id="mini" width="145" height="145"></canvas>

  <div id="job" class="panel">📍 Explore the city</div>
  <div id="message">Explore the city</div>

  <div id="joy">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>

  <div id="actions">
    <button id="jump">⬆</button>
    <button id="interact">E</button>
    <button id="cam">🎥</button>
  </div>

  <button id="phoneBtn">📱</button>

  <div id="carInfo">
    <div>🚗 <span id="speed">0</span> km/h</div>
    <button id="exitCar">Exit</button>
    <button id="viewCar">Camera</button>
  </div>

  <div id="phone">
    <h2>📱 My Phone</h2>
    <div class="apps" id="apps">
      <div class="app" data-app="taxi"><span>🚕</span>Taxi</div>
      <div class="app" data-app="jobs"><span>💼</span>Jobs</div>
      <div class="app" data-app="food"><span>🍔</span>Food</div>
      <div class="app" data-app="wallet"><span>💰</span>Wallet</div>
      <div class="app" data-app="map"><span>🗺️</span>Map</div>
      <div class="app" data-app="garage"><span>🚗</span>Garage</div>
      <div class="app" data-app="store"><span>📥</span>App Store</div>
    </div>
    <div id="appPage"></div>
    <button id="backApps" style="display:none;width:100%">Back</button>
    <button id="phoneClose">Close Phone</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

if(!window.THREE){
  $("message").innerText="3D engine loading failed. Internet connection check karo.";
  return;
}

// WORLD

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91d5ff);
scene.fog=new THREE.Fog(0x91d5ff,250,750);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
$("world").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x62814b,2));

const sun=new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(150,250,100);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mats={};

function material(color){
  if(!mats[color]) mats[color]=new THREE.MeshStandardMaterial({color,roughness:.85});
  return mats[color];
}

function box(parent,x,y,z,w,h,d,color){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}

// Ground

box(scene,0,-.5,0,600,1,600,0x65a64c);

// Roads

const roads=[];

function road(x,z,w,d){
  box(scene,x,.05,z,w,.15,d,0x343a40);
  roads.push({x,z,w,d});

  // lane stripes
  if(w>d){
    for(let a=x-w/2+10;a<x+w/2;a+=18){
      box(scene,a,.14,z,7,.025,.3,0xffffff);
    }
  }else{
    for(let a=z-d/2+10;a<z+d/2;a+=18){
      box(scene,x,.14,a,.3,.025,7,0xffffff);
    }
  }
}

// City grid

for(let i=-250;i<=250;i+=100){
  road(i,0,14,550);
  road(0,i,550,14);
}

// Sidewalks

for(let i=-250;i<=250;i+=100){
  box(scene,i+10,.18,0,3,.3,550,0xbcbcbc);
  box(scene,i-10,.18,0,3,.3,550,0xbcbcbc);

  box(scene,0,.18,i+10,550,.3,3,0xbcbcbc);
  box(scene,0,.18,i-10,550,.3,3,0xbcbcbc);
}

// Buildings

const buildings=[];
const locations=[];

function building(x,z,w,d,h,color,name){
  const g=new THREE.Group();

  box(g,0,h/2,0,w,h,d,color);

  // roof
  box(g,0,h+.15,0,w+.5,.3,d+.5,0x777777);

  // windows
  for(let y=3;y<h-1;y+=4){
    for(let a=-w/2+3;a<w/2-1;a+=5){
      box(g,a,y,d/2+.08,2,2,.12,0x82d8ff);
    }
  }

  // entrance
  box(g,0,1.5,d/2+.12,2.5,3,.2,0x513d2a);

  g.position.set(x,0,z);
  scene.add(g);

  buildings.push({x,z,w,d,h,name});
  return g;
}

// Fixed plots: Buildings never overlap roads

for(let x=-225;x<=225;x+=50){
  for(let z=-225;z<=225;z+=50){

    if(Math.abs(x%100)<20 || Math.abs(z%100)<20) continue;

    building(
      x,z,25,25,
      12+Math.floor(Math.random()*22),
      [0xd9c2a0,0xb6c9d9,0xd5d5d5,0xe8bba2,0xc6b3e0][Math.floor(Math.random()*5)],
      "House"
    );
  }
}

// Important locations

function landmark(x,z,name,color){
  building(x,z,32,32,22,color,name);
  locations.push({x,z,name});
}

landmark(-150,-150,"Police Station",0x7196d5);
landmark(150,-150,"Hospital",0xececec);
landmark(-150,150,"Garage",0x929292);
landmark(150,150,"School",0xe0b55b);
landmark(0,-200,"Park",0x348c45);
landmark(0,200,"Bus Station",0x4d8dbf);
landmark(-200,0,"Market",0xe5a64b);
landmark(200,0,"Petrol Pump",0x4faaa0);

// Park trees

function tree(x,z){
  const g=new THREE.Group();
  box(g,0,2,0,1.4,4,1.4,0x754b26);
  box(g,0,5,0,5,5,5,0x20853d);
  g.position.set(x,0,z);
  scene.add(g);
}

for(let i=0;i<45;i++){
  tree(Math.random()*400-200,Math.random()*400-200);
}

// Character

function character(shirt=0x168cff){
  const g=new THREE.Group();

  box(g,0,3.4,0,1.8,2.8,1.1,shirt);
  box(g,0,5.5,0,1.7,1.7,1.7,0xffd0a0);

  box(g,-1.1,3.3,0,.6,2,.6,0xffd0a0);
  box(g,1.1,3.3,0,.6,2,.6,0xffd0a0);

  const leg1=box(g,-.45,1,0,.7,2,.7,0x263b68);
  const leg2=box(g,.45,1,0,.7,2,.7,0x263b68);

  g.userData={leg1,leg2};

  return g;
}

const player=character();
player.position.set(0,0,20);
scene.add(player);

// Car

function carModel(color=0x168cff){
  const g=new THREE.Group();

  box(g,0,1.4,0,4.8,1.4,7,color);
  box(g,0,2.8,-.6,3.7,1.8,3.5,0x9bdfff);

  // seats
  box(g,-.9,2.1,1.1,.9,1,.9,0x222222);
  box(g,.9,2.1,1.1,.9,1,.9,0x222222);

  // Dashboard
  box(g,0,2.4,2.5,3.8,.5,.6,0x222222);

  // Steering
  const wheel=new THREE.Mesh(
    new THREE.TorusGeometry(.45,.09,8,16),
    material(0x111111)
  );
  wheel.position.set(.8,2.7,2.4);
  g.add(wheel);

  // Doors
  const doorL=box(g,-2.5,1.7,1.1,.2,1.5,2,0x168cff);
  const doorR=box(g,2.5,1.7,1.1,.2,1.5,2,0x168cff);

  const wheels=[];

  for(const x of [-2.4,2.4]){
    for(const z of [-2.3,2.3]){
      const w=new THREE.Mesh(
        new THREE.CylinderGeometry(.7,.7,.5,12),
        material(0x111111)
      );
      w.rotation.z=Math.PI/2;
      w.position.set(x,.8,z);
      g.add(w);
      wheels.push(w);
    }
  }

  g.userData={wheel,doorL,doorR,wheels};

  return g;
}

const playerCar=carModel();
playerCar.position.set(10,0,20);
scene.add(playerCar);

let driving=false;
let speed=0;
let interior=false;
let doorAnim=0;

const keys={};
const movement={up:false,down:false,left:false,right:false};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==="e")interact();
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function bindMove(id,key){
  const b=$(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    movement[key]=true;
    b.setPointerCapture(e.pointerId);
  });

  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>{
    b.addEventListener(ev,()=>movement[key]=false);
  });
}

bindMove("up","up");
bindMove("down","down");
bindMove("left","left");
bindMove("right","right");

function enterCar(){
  if(player.position.distanceTo(playerCar.position)>12)return;

  driving=true;
  player.visible=false;
  $("carInfo").style.display="block";
  $("message").innerText="Driving";
}

function exitCar(){
  driving=false;
  player.visible=true;

  player.position.copy(playerCar.position);
  player.position.x+=5;

  $("carInfo").style.display="none";
  $("message").innerText="Walking";
}

function interact(){
  if(driving){
    exitCar();
    return;
  }

  if(player.position.distanceTo(playerCar.position)<12){
    enterCar();
    return;
  }

  if(taxi && player.position.distanceTo(taxi.position)<10){
    taxiRide();
  }
}

$("interact").onclick=interact;
$("exitCar").onclick=exitCar;
$("viewCar").onclick=()=>interior=!interior;
$("cam").onclick=()=>interior=!interior;

// Phone

$("phoneBtn").onclick=()=>{
  $("phone").style.display=
    $("phone").style.display==="block"?"none":"block";
};

$("phoneClose").onclick=()=>{
  $("phone").style.display="none";
  backApps();
};

function backApps(){
  $("apps").style.display="grid";
  $("appPage").innerHTML="";
  $("backApps").style.display="none";
}

$("backApps").onclick=backApps;

let wallet=500;

function updateMoney(){
  $("money").innerText="₹ "+wallet;
}

function openApp(name){
  $("apps").style.display="none";
  $("backApps").style.display="block";

  const page=$("appPage");

  if(name==="taxi"){
    page.innerHTML=`
      <h3>🚕 Taxi Booking</h3>
      <input id="destination" placeholder="Destination">
      <button id="bookTaxi">Book Taxi</button>
      <div id="taxiStatus"></div>`;

    $("bookTaxi").onclick=bookTaxi;
  }

  if(name==="jobs"){
    page.innerHTML=`
      <h3>💼 Jobs</h3>
      <button data-job="Taxi Driver">Taxi Driver</button>
      <button data-job="Food Delivery">Food Delivery</button>
      <button data-job="Construction">Construction Worker</button>`;

    page.querySelectorAll("[data-job]").forEach(b=>{
      b.onclick=()=>startJob(b.dataset.job);
    });
  }

  if(name==="food"){
    page.innerHTML=`
      <h3>🍔 Food Booking</h3>
      <button data-food="Burger" data-cost="50">Burger ₹50</button>
      <button data-food="Pizza" data-cost="100">Pizza ₹100</button>
      <button data-food="Sandwich" data-cost="40">Sandwich ₹40</button>`;

    page.querySelectorAll("[data-food]").forEach(b=>{
      b.onclick=()=>orderFood(b.dataset.food,+b.dataset.cost);
    });
  }

  if(name==="wallet"){
    page.innerHTML=`
      <h3>💰 Virtual Wallet</h3>
      <h2>₹ ${wallet}</h2>
      <p>Virtual Money</p>`;
  }

  if(name==="map"){
    page.innerHTML=`
      <h3>🗺️ City Map</h3>
      <p>Live player position is shown on the map.</p>
      <p>White markers: Locations</p>
      <p>Blue marker: Player</p>`;
  }

  if(name==="garage"){
    page.innerHTML=`
      <h3>🚗 Garage</h3>
      <p>Compact Starter Car</p>
      <p>Vehicle Health: 100%</p>
      <p>Car is parked near your spawn.</p>`;
  }

  if(name==="store"){
    page.innerHTML=`
      <h3>📥 App Store</h3>
      <button data-install="Taxi App">Taxi App</button>
      <button data-install="Job App">Job App</button>
      <button data-install="Food App">Food App</button>
      <div id="install"></div>`;

    page.querySelectorAll("[data-install]").forEach(b=>{
      b.onclick=()=>{
        $("install").innerText=b.dataset.install+" Installed!";
      };
    });
  }
}

$("apps").querySelectorAll("[data-app]").forEach(b=>{
  b.onclick=()=>openApp(b.dataset.app);
});

// Taxi System

let taxi=null;
let driver=null;
let taxiBooked=false;
let taxiCountdown=null;

function bookTaxi(){

  if(taxiBooked){
    $("taxiStatus").innerText="Taxi already booked";
    return;
  }

  taxiBooked=true;

  let t=10;

  $("taxiStatus").innerText="Taxi arriving in 10 seconds";

  taxiCountdown=setInterval(()=>{
    t--;

    $("taxiStatus").innerText="Taxi arriving in "+t+" seconds";

    if(t<=0){
      clearInterval(taxiCountdown);
      spawnTaxi();
      $("taxiStatus").innerText="Taxi arrived!";
      $("message").innerText="Taxi Driver is waiting";
    }
  },1000);
}

function spawnTaxi(){
  taxi=carModel(0xffcc00);

  // recolor body
  taxi.children[0].material=material(0xffcc00);

  taxi.position.set(
    player.position.x+25,
    0,
    player.position.z
  );

  scene.add(taxi);

  driver=character(0x222222);
  driver.position.copy(taxi.position);
  scene.add(driver);
}

function taxiRide(){

  if(!taxi||!driver)return;

  $("message").innerText="Taxi ride started";

  // Player boards
  player.visible=false;

  setTimeout(()=>{
    taxiBooked=false;
    player.visible=true;
    player.position.copy(taxi.position);
    player.position.x+=5;

    scene.remove(taxi);
    scene.remove(driver);

    taxi=null;
    driver=null;

    wallet-=50;
    updateMoney();

    $("message").innerText="Taxi Ride Complete";
  },4000);
}

// Jobs

let currentJob=null;

function startJob(job){
  currentJob=job;

  $("job").innerText="💼 "+job+" Job";

  $("phone").style.display="none";

  $("message").innerText=job+" started";

  setTimeout(()=>{
    if(currentJob){
      wallet+=150;
      updateMoney();

      $("message").innerText=job+" completed +₹150";
      $("job").innerText="📍 Explore the city";

      currentJob=null;
    }
  },15000);
}

// Food

function orderFood(name,cost){
  if(wallet<cost){
    $("appPage").innerText="Not enough money!";
    return;
  }

  wallet-=cost;
  updateMoney();

  $("appPage").innerText=name+" ordered! Delivery coming soon.";
}

// Animation

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);
  const t=clock.elapsedTime;

  if(!driving){

    let x=0,z=0;

    if(keys.w||movement.up)z-=1;
    if(keys.s||movement.down)z+=1;
    if(keys.a||movement.left)x-=1;
    if(keys.d||movement.right)x+=1;

    if(x||z){
      const len=Math.hypot(x,z);
      x/=len;
      z/=len;

      player.position.x+=x*12*dt;
      player.position.z+=z*12*dt;

      player.rotation.y=Math.atan2(x,z);

      player.userData.leg1.rotation.x=Math.sin(t*8)*.6;
      player.userData.leg2.rotation.x=-Math.sin(t*8)*.6;
    }else{
      player.userData.leg1.rotation.x=0;
      player.userData.leg2.rotation.x=0;
    }

  }else{

    let acc=0;

    if(keys.w||movement.up)acc=1;
    if(keys.s||movement.down)acc=-1;

    speed+=acc*25*dt;
    speed*=.985;

    speed=THREE.MathUtils.clamp(speed,-20,55);

    if(keys.a||movement.left)playerCar.rotation.y+=1.5*dt;
    if(keys.d||movement.right)playerCar.rotation.y-=1.5*dt;

    playerCar.position.x+=Math.sin(playerCar.rotation.y)*speed*dt;
    playerCar.position.z+=Math.cos(playerCar.rotation.y)*speed*dt;

    playerCar.userData.wheels.forEach(w=>{
      w.rotation.x+=speed*dt;
    });

    $("speed").innerText=Math.abs(Math.round(speed));
  }

  // Taxi Driver follows player

  if(taxi&&driver){
    const dx=player.position.x-driver.position.x;
    const dz=player.position.z-driver.position.z;
    const d=Math.hypot(dx,dz);

    if(d>5){
      driver.position.x+=dx/d*3*dt;
      driver.position.z+=dz/d*3*dt;
      driver.rotation.y=Math.atan2(dx,dz);
    }
  }

  // Camera

  const target=driving?playerCar.position:player.position;

  if(driving&&interior){
    camera.position.lerp(
      new THREE.Vector3(
        playerCar.position.x,
        playerCar.position.y+4,
        playerCar.position.z+1
      ),.15
    );

    camera.lookAt(
      playerCar.position.x,
      playerCar.position.y+3,
      playerCar.position.z+12
    );

  }else{

    camera.position.lerp(
      new THREE.Vector3(
        target.x,
        target.y+10,
        target.z-18
      ),.12
    );

    camera.lookAt(target.x,target.y+3,target.z);
  }

  // Minimap

  const c=$("mini");
  const ctx=c.getContext("2d");

  ctx.clearRect(0,0,145,145);
  ctx.fillStyle="#294e35";
  ctx.fillRect(0,0,145,145);

  // City roads

  ctx.fillStyle="#626262";

  for(let i=-250;i<=250;i+=100){
    let px=72+i*.24;
    ctx.fillRect(px-2,0,5,145);
    ctx.fillRect(0,px-2,145,5);
  }

  // Locations

  locations.forEach(l=>{
    ctx.fillStyle="#ffffff";
    ctx.fillRect(72+l.x*.24-3,72+l.z*.24-3,6,6);
  });

  // Car

  ctx.fillStyle="#ffcc00";
  ctx.fillRect(
    72+playerCar.position.x*.24-3,
    72+playerCar.position.z*.24-3,
    6,6
  );

  // Player

  const p=driving?playerCar.position:player.position;

  ctx.fillStyle="#00ffff";
  ctx.beginPath();
  ctx.arc(72+p.x*.24,72+p.z*.24,5,0,Math.PI*2);
  ctx.fill();

  if(taxi){
    ctx.fillStyle="#ff3333";
    ctx.fillRect(
      72+taxi.position.x*.24-3,
      72+taxi.position.z*.24-3,
      6,6
    );
  }

  renderer.render(scene,camera);
}

animate();
