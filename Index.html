
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indian Roblox Simulator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101820;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  width: 100vw;
  height: 100vh;
}

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.panel {
  background: rgba(10, 20, 30, 0.88);
  border: 1px solid #00d9ff;
  border-radius: 12px;
  padding: 10px;
  pointer-events: auto;
}

#top {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

#money {
  color: #65ff9b;
  font-weight: bold;
}

#minimap {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 145px;
  height: 145px;
  background: #182a20;
  border: 2px solid cyan;
  border-radius: 10px;
}

#phoneButton {
  position: absolute;
  right: 15px;
  bottom: 25px;
  font-size: 30px;
  background: #101c2b;
  border: 2px solid cyan;
  border-radius: 15px;
  padding: 12px;
  pointer-events: auto;
}

#phone {
  display: none;
  position: absolute;
  width: min(320px, 90vw);
  height: 470px;
  right: 12px;
  bottom: 80px;
  background: #101820;
  border: 3px solid #00d9ff;
  border-radius: 25px;
  padding: 15px;
  pointer-events: auto;
  overflow-y: auto;
}

.app {
  display: inline-flex;
  width: 90px;
  height: 85px;
  margin: 4px;
  background: #203044;
  border-radius: 12px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  cursor: pointer;
  font-size: 13px;
}

.app span {
  font-size: 25px;
}

button {
  background: #087baf;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px;
  margin: 4px;
  cursor: pointer;
  font-weight: bold;
}

button:active {
  transform: scale(0.96);
}

#message {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.8);
  padding: 12px;
  border-radius: 10px;
  text-align: center;
}

#controls {
  position: absolute;
  left: 10px;
  bottom: 10px;
  pointer-events: auto;
}

.control {
  width: 55px;
  height: 55px;
  background: rgba(0,80,130,.8);
  border: 1px solid cyan;
  border-radius: 50%;
  font-size: 20px;
  touch-action: none;
}

#rightControls {
  position: absolute;
  right: 10px;
  bottom: 10px;
  pointer-events: auto;
}

#jobInfo {
  position: absolute;
  left: 10px;
  top: 90px;
  max-width: 220px;
}

#carHUD {
  display: none;
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  background: #08121c;
  border: 1px solid cyan;
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  background: #182a3b;
  color: white;
  border: 1px solid cyan;
  border-radius: 7px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div id="top">
    <div class="panel">🏙️ Indian Roblox Simulator</div>
    <div class="panel" id="money">₹ Virtual: 500</div>
    <div class="panel" id="mode">Mode: Walking</div>
  </div>

  <canvas id="minimap" width="145" height="145"></canvas>

  <div id="jobInfo" class="panel">
    <b>Mission</b>
    <div id="mission">Explore the City</div>
  </div>

  <div id="message">
    WASD / Joystick: Move<br>
    E: Enter / Exit Car
  </div>

  <div id="controls">
    <button class="control" id="forward">▲</button><br>
    <button class="control" id="left">◀</button>
    <button class="control" id="back">▼</button>
    <button class="control" id="right">▶</button>
  </div>

  <div id="rightControls">
    <button class="control" id="jump">⬆</button><br>
    <button class="control" id="interact">E</button>
  </div>

  <button id="phoneButton">📱</button>

  <div id="phone">

    <h2>📱 Virtual Phone</h2>
    <div>Indian Virtual Network</div>
    <hr>

    <div id="apps">

      <div class="app" onclick="openApp('taxi')">
        <span>🚕</span>Taxi
      </div>

      <div class="app" onclick="openApp('job')">
        <span>💼</span>Jobs
      </div>

      <div class="app" onclick="openApp('food')">
        <span>🍔</span>Food
      </div>

      <div class="app" onclick="openApp('wallet')">
        <span>💰</span>Wallet
      </div>

      <div class="app" onclick="openApp('map')">
        <span>🗺️</span>GPS
      </div>

      <div class="app" onclick="openApp('garage')">
        <span>🚗</span>Garage
      </div>

      <div class="app" onclick="openApp('store')">
        <span>📥</span>App Store
      </div>

    </div>

    <div id="appPage"></div>

    <button onclick="closePhone()">Close Phone</button>

  </div>

  <div id="carHUD">
    🚗 Driving Mode
    <br>
    <span id="speed">0 KM/H</span>
    <br>
    <button onclick="toggleCamera()">Camera View</button>
    <button onclick="interact()">Exit Car</button>
  </div>

</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 180, 700);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1500
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.shadowMap.enabled = true;

document.getElementById('game').appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff, 0x56734c, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);

sun.position.set(100, 200, 100);
sun.castShadow = true;

scene.add(sun);

// MATERIALS

function mat(color) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.85
  });
}

const grassMat = mat(0x65a34d);
const roadMat = mat(0x30353b);
const sidewalkMat = mat(0xbababa);
const whiteMat = mat(0xffffff);

// GROUND

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  grassMat
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;

scene.add(ground);

// CITY ROADS

const roadPositions = [];

for (let x = -200; x <= 200; x += 100) {
  roadPositions.push({ x, z: 0, vertical: true });
}

for (let z = -200; z <= 200; z += 100) {
  roadPositions.push({ x: 0, z, vertical: false });
}

function createRoad(x, z, vertical) {

  const road = new THREE.Mesh(
    new THREE.BoxGeometry(
      vertical ? 16 : 600,
      0.15,
      vertical ? 600 : 16
    ),
    roadMat
  );

  road.position.set(x, 0.08, z);
  road.receiveShadow = true;

  scene.add(road);

  // Road lane markings

  for (let i = -250; i <= 250; i += 20) {

    const line = new THREE.Mesh(
      new THREE.BoxGeometry(
        vertical ? 0.3 : 8,
        0.03,
        vertical ? 8 : 0.3
      ),
      whiteMat
    );

    line.position.set(
      vertical ? x : i,
      0.18,
      vertical ? i : z
    );

    scene.add(line);
  }

  // Sidewalk

  for (let side of [-1, 1]) {

    const sidewalk = new THREE.Mesh(
      new THREE.BoxGeometry(
        vertical ? 4 : 600,
        0.3,
        vertical ? 600 : 4
      ),
      sidewalkMat
    );

    sidewalk.position.set(
      vertical ? x + side * 10 : 0,
      0.25,
      vertical ? 0 : z + side * 10
    );

    scene.add(sidewalk);
  }
}

roadPositions.forEach(r => createRoad(r.x, r.z, r.vertical));

// BUILDINGS

const buildings = [];

function createBuilding(x, z, w, h, d, color, name) {

  const building = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat(color)
  );

  body.position.y = h / 2;
  body.castShadow = true;
  body.receiveShadow = true;

  building.add(body);

  // Windows

  for (let y = 2; y < h - 1; y += 3) {

    for (let wx = -w / 2 + 2; wx < w / 2 - 1; wx += 4) {

      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 1.5, 0.15),
        mat(0x6bd5ff)
      );

      windowMesh.position.set(
        wx,
        y,
        d / 2 + 0.1
      );

      building.add(windowMesh);
    }
  }

  building.position.set(x, 0, z);

  scene.add(building);

  buildings.push({
    x, z, w, d, name
  });

  return building;
}

// FIXED CITY GRID
// Buildings are placed away from road lanes.

const locations = [];

for (let x = -250; x <= 250; x += 50) {

  for (let z = -250; z <= 250; z += 50) {

    const roadX = Math.round(x / 100) * 100;
    const roadZ = Math.round(z / 100) * 100;

    if (
      Math.abs(x - roadX) < 18 ||
      Math.abs(z - roadZ) < 18
    ) {
      continue;
    }

    const name = "Building";

    createBuilding(
      x,
      z,
      25,
      10 + Math.random() * 20,
      25,
      [
        0xd6c3a5,
        0xb7c7d6,
        0xd5d5d5,
        0xe5bda0
      ][Math.floor(Math.random() * 4)],
      name
    );
  }
}

// IMPORTANT CITY LOCATIONS

function specialBuilding(x, z, color, name) {

  const building = createBuilding(
    x, z, 35, 20, 35, color, name
  );

  locations.push({
    x, z, name
  });

  return building;
}

specialBuilding(-150, -150, 0x3399ff, "Police Station");
specialBuilding(150, -150, 0xffffff, "Hospital");
specialBuilding(-150, 150, 0xffaa33, "Garage");
specialBuilding(150, 150, 0xffcc00, "School");
specialBuilding(0, -200, 0x44aa44, "Park");
specialBuilding(0, 200, 0x8888ff, "Bus Station");
specialBuilding(-200, 0, 0xff4444, "Market");
specialBuilding(200, 0, 0x66ccaa, "Petrol Pump");

// TREES

function createTree(x, z) {

  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 5, 1.5),
    mat(0x79502b)
  );

  trunk.position.y = 2.5;

  const leaves = new THREE.Mesh(
    new THREE.BoxGeometry(5, 5, 5),
    mat(0x237c38)
  );

  leaves.position.y = 6;

  tree.add(trunk, leaves);

  tree.position.set(x, 0, z);

  scene.add(tree);
}

for (let i = 0; i < 80; i++) {

  const x = Math.random() * 500 - 250;
  const z = Math.random() * 500 - 250;

  createTree(x, z);
}

// BLOCKY CHARACTER

function createCharacter(color = 0x00aaff) {

  const character = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 3, 1.3),
    mat(color)
  );

  body.position.y = 3.5;

  const head = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.8, 1.8),
    mat(0xffd1a1)
  );

  head.position.y = 6;

  const leftLeg = new THREE.Mesh(
    new THREE.BoxGeometry(0.8, 2, 0.8),
    mat(0x222244)
  );

  leftLeg.position.set(-0.5, 1, 0);

  const rightLeg = leftLeg.clone();

  rightLeg.position.x = 0.5;

  const leftArm = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 2, 0.7),
    mat(0xffd1a1)
  );

  leftArm.position.set(-1.3, 3.5, 0);

  const rightArm = leftArm.clone();

  rightArm.position.x = 1.3;

  character.add(
    body,
    head,
    leftLeg,
    rightLeg,
    leftArm,
    rightArm
  );

  character.userData = {
    leftLeg,
    rightLeg,
    leftArm,
    rightArm
  };

  character.traverse(obj => {

    if (obj.isMesh) {
      obj.castShadow = true;
    }

  });

  return character;
}

const player = createCharacter(0x0088ff);

player.position.set(0, 0, 15);

scene.add(player);

// STARTER CAR

function createCar(color = 0x2299ff) {

  const car = new THREE.Group();

  const chassis = new THREE.Mesh(
    new THREE.BoxGeometry(5, 1.5, 8),
    mat(color)
  );

  chassis.position.y = 1.5;

  car.add(chassis);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(3.8, 2, 4),
    mat(0x9bdfff)
  );

  cabin.position.set(0, 3, -0.5);

  car.add(cabin);

  const wheels = [];

  for (const x of [-2.6, 2.6]) {

    for (const z of [-2.5, 2.5]) {

      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.8, 0.8, 0.6, 12),
        mat(0x111111)
      );

      wheel.rotation.z = Math.PI / 2;

      wheel.position.set(x, 1, z);

      car.add(wheel);

      wheels.push(wheel);
    }
  }

  // Interior dashboard

  const dashboard = new THREE.Mesh(
    new THREE.BoxGeometry(3.5, 0.5, 0.6),
    mat(0x222222)
  );

  dashboard.position.set(0, 2.7, 2.7);

  car.add(dashboard);

  // Steering Wheel

  const steering = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.1, 8, 16),
    mat(0x111111)
  );

  steering.position.set(1, 2.7, 2.6);

  car.add(steering);

  car.userData = {
    wheels,
    steering,
    doorOpen: false,
    cabin
  };

  car.traverse(obj => {

    if (obj.isMesh) {
      obj.castShadow = true;
    }

  });

  return car;
}

const car = createCar();

car.position.set(10, 0, 15);

scene.add(car);

// TAXI

let taxi = null;
let taxiDriver = null;

function createTaxi() {

  taxi = createCar(0xffcc00);

  scene.add(taxi);

  taxiDriver = createCharacter(0x222222);

  taxiDriver.visible = false;

  scene.add(taxiDriver);
}

// PLAYER STATE

let driving = false;
let interiorCamera = false;
let carSpeed = 0;
let playerRotation = 0;

const keys = {};

window.addEventListener('keydown', e => {

  keys[e.key.toLowerCase()] = true;

  if (e.key.toLowerCase() === 'e') {
    interact();
  }

  if (e.key.toLowerCase() === 'f') {
    toggleCamera();
  }

});

window.addEventListener('keyup', e => {

  keys[e.key.toLowerCase()] = false;

});

// TOUCH CONTROLS

const movement = {
  forward: false,
  back: false,
  left: false,
  right: false
};

function bindButton(id, key) {

  const button = document.getElementById(id);

  button.addEventListener('touchstart', e => {

    e.preventDefault();

    movement[key] = true;

  });

  button.addEventListener('touchend', e => {

    e.preventDefault();

    movement[key] = false;

  });

  button.addEventListener('mousedown', () => {
    movement[key] = true;
  });

  button.addEventListener('mouseup', () => {
    movement[key] = false;
  });

}

bindButton('forward', 'forward');
bindButton('back', 'back');
bindButton('left', 'left');
bindButton('right', 'right');

document.getElementById('jump').onclick = () => {

  if (!driving) {

    player.position.y += 2;

    setTimeout(() => {
      player.position.y = 0;
    }, 400);

  }
};

// INTERACTION

function interact() {

  if (driving) {

    driving = false;

    player.visible = true;

    player.position.copy(car.position);

    player.position.x += 5;

    document.getElementById('carHUD').style.display = 'none';

    document.getElementById('mode').innerText =
      'Mode: Walking';

    return;
  }

  const distance = player.position.distanceTo(car.position);

  if (distance < 12) {

    driving = true;

    player.visible = false;

    document.getElementById('carHUD').style.display = 'block';

    document.getElementById('mode').innerText =
      'Mode: Driving';

    return;
  }

  if (taxi && player.position.distanceTo(taxi.position) < 10) {

    document.getElementById('message').innerText =
      'Taxi is ready!';

  }

}

document.getElementById('interact').onclick = interact;

// CAMERA

function toggleCamera() {

  interiorCamera = !interiorCamera;

}

// PHONE

const phone = document.getElementById('phone');

document.getElementById('phoneButton').onclick = () => {

  phone.style.display =
    phone.style.display === 'block' ? 'none' : 'block';

};

function closePhone() {

  phone.style.display = 'none';

}

let wallet = 500;

function updateWallet() {

  document.getElementById('money').innerText =
    '₹ Virtual: ' + wallet;

}

function openApp(app) {

  const page = document.getElementById('appPage');

  document.getElementById('apps').style.display = 'none';

  if (app === 'taxi') {

    page.innerHTML = `
      <h3>🚕 Taxi Booking</h3>
      <p>Pickup: Current Location</p>
      <input id="destination" placeholder="Destination">
      <button onclick="bookTaxi()">Book Taxi</button>
      <div id="taxiStatus"></div>
    `;

  }

  if (app === 'job') {

    page.innerHTML = `
      <h3>💼 Job Center</h3>
      <button onclick="startJob('Taxi Driver')">Taxi Driver</button>
      <button onclick="startJob('Food Delivery')">Food Delivery</button>
      <button onclick="startJob('Construction')">Construction</button>
    `;

  }

  if (app === 'food') {

    page.innerHTML = `
      <h3>🍔 Food Booking</h3>
      <button onclick="orderFood('Burger', 50)">Burger ₹50</button>
      <button onclick="orderFood('Pizza', 100)">Pizza ₹100</button>
      <button onclick="orderFood('Sandwich', 40)">Sandwich ₹40</button>
    `;

  }

  if (app === 'wallet') {

    page.innerHTML = `
      <h3>💰 Virtual Wallet</h3>
      <h2>₹${wallet}</h2>
      <p>Indian Virtual Currency</p>
    `;

  }

  if (app === 'map') {

    page.innerHTML = `
      <h3>🗺️ GPS Map</h3>
      <p>Blue marker: Player</p>
      <p>Yellow marker: Car</p>
      <p>Red marker: Taxi</p>
      <p>Special Buildings are shown on Mini Map.</p>
    `;

  }

  if (app === 'garage') {

    page.innerHTML = `
      <h3>🚗 Garage</h3>
      <p>Starter Car: Compact</p>
      <p>Vehicle Health: 100%</p>
      <p>Customization: Coming in Prototype 2</p>
    `;

  }

  if (app === 'store') {

    page.innerHTML = `
      <h3>📥 App Store</h3>
      <button onclick="installApp('Taxi')">Download Taxi App</button>
      <button onclick="installApp('Job Center')">Download Job App</button>
      <button onclick="installApp('Food')">Download Food App</button>
      <div id="installStatus"></div>
    `;

  }

}

function backToApps() {

  document.getElementById('appPage').innerHTML = '';

  document.getElementById('apps').style.display = 'block';

}

function installApp(name) {

  document.getElementById('installStatus').innerText =
    name + ' App Installed!';

}

function orderFood(name, price) {

  if (wallet < price) {

    alert('Not enough money!');

    return;
  }

  wallet -= price;

  updateWallet();

  alert(name + ' Ordered! Delivery is on the way.');

}

let currentJob = null;

function startJob(name) {

  currentJob = name;

  document.getElementById('mission').innerText =
    'Job: ' + name + ' | Reach the Green Marker';

  closePhone();

  alert(name + ' Job Started!');

}

// TAXI BOOKING

let taxiTimer = null;

function bookTaxi() {

  if (taxi) {

    alert('Taxi already booked!');

    return;
  }

  document.getElementById('taxiStatus').innerText =
    'Taxi arriving in 10 seconds...';

  let countdown = 10;

  const interval = setInterval(() => {

    countdown--;

    document.getElementById('taxiStatus').innerText =
      'Taxi arriving in ' + countdown + ' seconds...';

    if (countdown <= 0) {

      clearInterval(interval);

      createTaxi();

      taxi.position.set(
        player.position.x + 25,
        0,
        player.position.z
      );

      taxiDriver.visible = true;

      taxiDriver.position.copy(taxi.position);

      document.getElementById('taxiStatus').innerText =
        'Taxi Arrived!';

      closePhone();

      document.getElementById('message').innerText =
        'Taxi Driver is arriving!';
    }

  }, 1000);

}

// JOB REWARD

function completeJob() {

  if (currentJob) {

    wallet += 150;

    updateWallet();

    alert('Job Completed! ₹150 Earned.');

    currentJob = null;

    document.getElementById('mission').innerText =
      'Explore the City';

  }

}

// NPCs

const npcs = [];

function createNPC(x, z, color, job) {

  const npc = createCharacter(color);

  npc.position.set(x, 0, z);

  scene.add(npc);

  npcs.push({
    model: npc,
    homeX: x,
    homeZ: z,
    targetX: x + Math.random() * 20 - 10,
    targetZ: z + Math.random() * 20 - 10,
    job,
    phase: Math.random() * 10
  });

}

createNPC(40, 30, 0xff0000, 'Shopkeeper');
createNPC(-40, 30, 0x00ff00, 'Worker');
createNPC(40, -30, 0xffaa00, 'Police');
createNPC(-40, -30, 0x9900ff, 'Delivery Worker');
createNPC(70, 50, 0x00ffff, 'Mechanic');
createNPC(-70, 50, 0xff00ff, 'Security');

// ANIMATION LOOP

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  const time = clock.elapsedTime;

  // PLAYER

  if (!driving) {

    let moveX = 0;
    let moveZ = 0;

    if (keys['w'] || movement.forward) moveZ -= 1;
    if (keys['s'] || movement.back) moveZ += 1;
    if (keys['a'] || movement.left) moveX -= 1;
    if (keys['d'] || movement.right) moveX += 1;

    if (moveX !== 0 || moveZ !== 0) {

      const length = Math.sqrt(
        moveX * moveX + moveZ * moveZ
      );

      moveX /= length;
      moveZ /= length;

      player.position.x += moveX * 12 * delta;
      player.position.z += moveZ * 12 * delta;

      player.rotation.y = Math.atan2(moveX, moveZ);

      const animation = player.userData;

      animation.leftLeg.rotation.x =
        Math.sin(time * 8) * 0.6;

      animation.rightLeg.rotation.x =
        -Math.sin(time * 8) * 0.6;

      animation.leftArm.rotation.x =
        -Math.sin(time * 8) * 0.5;

      animation.rightArm.rotation.x =
        Math.sin(time * 8) * 0.5;

    } else {

      player.userData.leftLeg.rotation.x = 0;
      player.userData.rightLeg.rotation.x = 0;

    }

  }

  // CAR

  if (driving) {

    let acceleration = 0;

    if (keys['w'] || movement.forward) acceleration = 1;
    if (keys['s'] || movement.back) acceleration = -1;

    carSpeed += acceleration * 20 * delta;

    carSpeed *= 0.98;

    carSpeed = THREE.MathUtils.clamp(
      carSpeed,
      -20,
      60
    );

    if (keys['a'] || movement.left) {
      car.rotation.y += 1.5 * delta;
    }

    if (keys['d'] || movement.right) {
      car.rotation.y -= 1.5 * delta;
    }

    car.position.x +=
      Math.sin(car.rotation.y) * carSpeed * delta;

    car.position.z +=
      Math.cos(car.rotation.y) * carSpeed * delta;

    car.userData.wheels.forEach(wheel => {
      wheel.rotation.x += carSpeed * delta;
    });

    car.userData.steering.rotation.z =
      (keys['a'] ? 0.5 : 0) -
      (keys['d'] ? 0.5 : 0);

    document.getElementById('speed').innerText =
      Math.abs(Math.round(carSpeed)) + ' KM/H';

  } else {

    carSpeed = 0;

  }

  // NPC JOB BEHAVIOR

  npcs.forEach((npc, index) => {

    const model = npc.model;

    npc.phase += delta;

    if (npc.phase > 8) {

      npc.phase = 0;

      npc.targetX =
        npc.homeX + Math.random() * 20 - 10;

      npc.targetZ =
        npc.homeZ + Math.random() * 20 - 10;

    }

    const dx = npc.targetX - model.position.x;
    const dz = npc.targetZ - model.position.z;

    const distance = Math.sqrt(dx * dx + dz * dz);

    if (distance > 1) {

      model.position.x += dx / distance * 3 * delta;
      model.position.z += dz / distance * 3 * delta;

      model.rotation.y = Math.atan2(dx, dz);

      model.userData.leftLeg.rotation.x =
        Math.sin(time * 5 + index) * 0.5;

      model.userData.rightLeg.rotation.x =
        -Math.sin(time * 5 + index) * 0.5;

    }

  });

  // TAXI DRIVER

  if (taxi && taxiDriver && taxiDriver.visible) {

    const distance = taxiDriver.position.distanceTo(
      player.position
    );

    if (distance > 5) {

      const direction = new THREE.Vector3()
        .subVectors(player.position, taxiDriver.position)
        .normalize();

      taxiDriver.position.addScaledVector(
        direction,
        3 * delta
      );

      taxiDriver.rotation.y =
        Math.atan2(direction.x, direction.z);

    } else {

      document.getElementById('message').innerText =
        'Taxi Driver: Please enter the taxi!';

    }

  }

  // CAMERA

  let target;

  if (driving) {

    if (interiorCamera) {

      target = new THREE.Vector3(
        car.position.x,
        car.position.y + 4,
        car.position.z + 1
      );

      camera.position.lerp(target, 0.15);

      const look = new THREE.Vector3(
        car.position.x,
        car.position.y + 3,
        car.position.z + 15
      );

      camera.lookAt(look);

    } else {

      target = new THREE.Vector3(
        car.position.x,
        car.position.y + 3,
        car.position.z + 15
      );

      camera.lookAt(look);

    } else {

      target = new THREE.Vector3(
        car.position.x,
        car.position.y + 10,
        car.position.z - 20
      );

      camera.position.lerp(target, 0.1);

      camera.lookAt(car.position);

    }

  } else {

    target = new THREE.Vector3(
      player.position.x,
      player.position.y + 10,
      player.position.z - 20
    );

    camera.position.lerp(target, 0.1);

    camera.lookAt(player.position);

  }

  // MINIMAP

  const map = document.getElementById('minimap');

  const ctx = map.getContext('2d');

  ctx.clearRect(0, 0, 145, 145);

  ctx.fillStyle = '#234d32';

  ctx.fillRect(0, 0, 145, 145);

  ctx.fillStyle = '#555';

  for (let i = 0; i < 145; i += 25) {

    ctx.fillRect(i, 0, 10, 145);

    ctx.fillRect(0, i, 145, 10);

  }

  function drawMarker(pos, color) {

    const x = 72 + pos.x * 0.2;
    const z = 72 + pos.z * 0.2;

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(x, z, 4, 0, Math.PI * 2);

    ctx.fill();

  }

  drawMarker(
    driving ? car.position : player.position,
    '#00ffff'
  );

  drawMarker(car.position, '#ffff00');

  if (taxi) {
    drawMarker(taxi.position, '#ff0000');
  }

  locations.forEach(loc => {

    drawMarker(
      new THREE.Vector3(loc.x, 0, loc.z),
      '#ffffff'
    );

  });

  renderer.render(scene, camera);

}

animate();

// WINDOW RESIZE

window.addEventListener('resize', () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

updateWallet();

</script>

</body>
</html>
